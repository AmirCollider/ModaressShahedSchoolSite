        <div>
          <div class="school-name">مدرسه شاهد</div>
          <div class="school-subtitle">دبیرستان دوره دوم منطقه ۱۲ تهران</div>
        </div>
      </a>
      <nav class="nav" aria-label="منوی اصلی">

  <footer class="site-footer">

      <span>مدرسه شاهد ـ دبیرستان دوره دوم منطقه ۱۲ تهران</span>
